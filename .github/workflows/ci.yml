name: CI

on:
    push:
        branches: [main, stable]
        tags: ["v*"]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.22.2
                  cache: npm

            - run: npm ci

            - run: npm run check

            - name: Validate installer syntax
              run: bash -n install.sh

            - name: Smoke-test checkout installer
              run: |
                  target="$(mktemp -d)"
                  ./install.sh --no-build --dir "$target"
                  test -s "$target/plugin.js"

            - name: Smoke-test piped installer
              run: |
                  target="$(mktemp -d)"
                  cat install.sh | LUMEN_ARTIFACT_URL="file://${GITHUB_WORKSPACE}/desktop/plugin.js" bash -s -- --dir "$target"
                  test -s "$target/plugin.js"
